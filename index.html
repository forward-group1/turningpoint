<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勞資顧問預約與爭議評估</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .form-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
    .section-title {
      border-left: 4px solid #0d6efd;
      padding-left: 10px;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #212529;
    }
    .required-star {
      color: #dc3545;
      margin-left: 2px;
    }
    .form-check-input:checked {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="form-card">
        <h2 class="text-center mb-4 font-weight-bold">勞資顧問預約與爭議評估表單</h2>
        <p class="text-muted text-center mb-5">請填寫以下資訊，我們的專業勞資顧問團隊將儘速與您聯繫並安排諮詢時段。</p>

        <form id="consultForm" novalidate>
          
          <!-- 第一區塊：基本資料 -->
          <h4 class="section-title">一、公司與聯絡人基本資料</h4>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="companyName" class="form-label">公司名稱 <span class="required-star">*</span></label>
              <input type="text" id="companyName" class="form-control" placeholder="XX股份有限公司">
            </div>
            
            <div class="col-md-6">
              <label for="industry" class="form-label">產業類別 <span class="required-star">*</span></label>
              <input type="text" id="industry" class="form-control" placeholder="例如：餐飲業、科技業、製造業">
            </div>

            <div class="col-md-6">
              <label for="userName" class="form-label">聯絡人姓名 <span class="required-star">*</span></label>
              <input type="text" id="userName" class="form-control" placeholder="王小明">
            </div>

            <div class="col-md-6">
              <label for="jobTitle" class="form-label">職稱 <span class="required-star">*</span></label>
              <select id="jobTitle" class="form-select">
                <option value="" selected disabled>請選擇職稱</option>
                <option value="負責人/高階主管">負責人 / 高階主管</option>
                <option value="人資主管/專員">人資主管 / 專員</option>
                <option value="法務主管/專員">法務主管 / 專員</option>
                <option value="行政/財務部門">行政 / 財務部門</option>
                <option value="其他">其他</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label">聯絡電話 <span class="required-star">*</span></label>
              <input type="tel" id="phone" class="form-control" placeholder="例如：0912345678 或 02-12345678">
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">電子郵件 <span class="required-star">*</span></label>
              <input type="email" id="email" class="form-control" placeholder="example@email.com">
            </div>

            <div class="col-12">
              <label class="form-label d-block">公司規模 <span class="required-star">*</span></label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="companySize" id="size1" value="10人以下">
                <label class="form-check-label" for="size1">10 人以下</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="companySize" id="size2" value="11-30人">
                <label class="form-check-label" for="size2">11 - 30 人</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="companySize" id="size3" value="31-100人">
                <label class="form-check-label" for="size3">31 - 100 人</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="companySize" id="size4" value="100人以上">
                <label class="form-check-label" for="size4">100 人以上</label>
              </div>
            </div>
          </div>

          <!-- 第二區塊：勞務議題諮詢 -->
          <h4 class="section-title">二、諮詢與爭議評估內容</h4>
          <div class="mb-4">
            <label class="form-label d-block">遭遇的勞務議題（可複選） <span class="required-star">*</span></label>
            <div class="row g-2">
              <div class="col-md-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="issues" id="issue1" value="勞資爭議調解/訴訟風險">
                  <label class="form-check-label" for="issue1">勞資爭議調解 / 訴訟風險</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="issues" id="issue2" value="解僱/資遣/離職爭議">
                  <label class="form-check-label" for="issue2">解僱 / 資遣 / 離職爭議</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="issues" id="issue3" value="工作規則/勞動契約擬定與修訂">
                  <label class="form-check-label" for="issue3">工作規則 / 勞動契約擬定與修訂</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="issues" id="issue4" value="加班費/工資/工時計算爭議">
                  <label class="form-check-label" for="issue4">加班費 / 工資 / 工時計算爭議</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="issues" id="issue5" value="職業災害處理與補償">
                  <label class="form-check-label" for="issue5">職業災害處理與補償</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="issues" id="issue6" value="勞動檢查因應與裁罰申訴">
                  <label class="form-check-label" for="issue6">勞動檢查因應與裁罰申訴</label>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <label for="description" class="form-label">具體爭議與遭遇問題描述 <span class="required-star">*</span></label>
            <textarea id="description" class="form-control" rows="4" placeholder="請簡述目前面臨的情況、員工提告或調解的訴求，以便顧問能更精準地為您評估..."></textarea>
          </div>

          <!-- 第三區塊：期望諮詢時段 -->
          <h4 class="section-title">三、期望諮詢時段預約</h4>
          <p class="text-muted small mb-3">請至少提供一組您方便諮詢的時段（顧問將於確認後回覆最終安排）：</p>
          
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="bookingDate1" class="form-label">首選日期 <span class="required-star">*</span></label>
              <input type="date" id="bookingDate1" class="form-control">
            </div>
            <div class="col-md-6">
              <label for="bookingTime1" class="form-label">首選時間 <span class="required-star">*</span></label>
              <select id="bookingTime1" class="form-select">
                <option value="" selected disabled>請選擇時間區間</option>
                <option value="09:30-11:00">09:30 - 11:00</option>
                <option value="11:00-12:30">11:00 - 12:30</option>
                <option value="14:00-15:30">14:00 - 15:30</option>
                <option value="15:30-17:00">15:30 - 17:00</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="bookingDate2" class="form-label">次選日期（選填）</label>
              <input type="date" id="bookingDate2" class="form-control">
            </div>
            <div class="col-md-6">
              <label for="bookingTime2" class="form-label">次選時間（選填）</label>
              <select id="bookingTime2" class="form-select">
                <option value="" selected disabled>請選擇時間區間</option>
                <option value="09:30-11:00">09:30 - 11:00</option>
                <option value="11:00-12:30">11:00 - 12:30</option>
                <option value="14:00-15:30">14:00 - 15:30</option>
                <option value="15:30-17:00">15:30 - 17:00</option>
              </select>
            </div>
          </div>

          <!-- 同意條款與提交 -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="consent">
            <label class="form-check-label ms-1" for="consent">
              我已理解並同意上述資料僅供勞資諮詢與評估使用，顧問團隊將對資料嚴格保密。 <span class="required-star">*</span>
            </label>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg">確認送出預約表單</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<!-- JS 檔案引用 -->
<script src="script.js"></script>
</body>
</html>
